aid: stepful
name: Stepful
description: >-
  Stepful is a New York-based healthcare workforce education company that trains people with a
  high-school education for entry-level allied-health roles in as little as four months. It runs
  live, cohort-based online programs — Medical Assistant, Pharmacy Technician, Patient Care
  Technician, Medical Administrative Assistant, Surgical Technologist, Dental Assistant, Phlebotomy
  Technician, Sterile Processing and Practical Nursing — pairing virtual instructor-led classes and
  1:1 coaching with at-home clinical skills kits, employer-site clinical rotations and an AI-assisted
  practice platform, then places graduates into hospital and clinic jobs. Its "School-as-a-Service"
  employer product lets health systems stand up in-house training and upskilling pipelines. Stepful
  is backed by Y Combinator, Oak HC/FT and Reach Capital, has raised a $31.5M Series B and a $55M
  Series C, and reports having served more than 30,000 students. It is a Delaware corporation
  approved to operate by state career-school boards in Alabama, California, Indiana, Kentucky,
  Michigan, Ohio, Pennsylvania, Texas and Utah. Stepful publishes no public developer API: its
  student classroom and staff admin applications are both authenticated-only, and no OpenAPI,
  GraphQL, MCP or webhook contract is served from any host it controls.
