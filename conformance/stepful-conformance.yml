domain_standard_note: >-
  REWARD-ONLY CHECK, HONEST MISS. Stepful sits in a market that does have real
  interoperability standards (1EdTech LTI/OneRoster/Caliper/QTI, xAPI, Ed-Fi) and its
  employer "School-as-a-Service" product is exactly the shape that would consume them — an
  employer standing up training against its own HR and workforce systems. None is declared,
  because no contract exists in which to declare one. This is the single highest-leverage
  gap on this profile, not a penalty.
