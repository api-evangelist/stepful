- id: asyncapi
  conforms: false
  evidence: No event, streaming or webhook surface is documented or served.
- id: mcp
  conforms: false
  evidence: >-
    No MCP endpoint on any Stepful-operated host. c.stepful.com/api/mcp exists but is
