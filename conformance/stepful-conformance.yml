method: searched
source: >-
  https://www.stepful.com/regulatory-information (HTTP 200),
  https://www.stepful.com/privacy-policy (HTTP 200), contract-discovery probes across every
  stepful.com host, 2026-08-29
note: >-
  Stepful publishes no machine-readable contract of any kind, so every API/interoperability
  conformance assertion below is necessarily false and is recorded as an honest negative
  rather than omitted. What Stepful DOES publish, and publishes well, is a detailed
  regulatory-compliance disclosure: named state career-school approvals with license
  numbers. That is the compliance surface this company actually has, and it is what the
  `Compliance` pointer in apis.yml points at.
api_conformance:
