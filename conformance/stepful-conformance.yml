  conforms: false
  evidence: >-
    /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /docs, /redoc
    all 404 on www.stepful.com, classroom.stepful.com and admin.stepful.com.
- id: graphql
  conforms: false
